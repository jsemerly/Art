<!DOCTYPE HTML>

<html>

<head>

```
<title>Artwork</title>

<meta charset="utf-8" />

<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
/>

<link
    rel="stylesheet"
    href="assets/css/main.css"
/>

<!-- Font Awesome -->

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>
```

</head>

<body>

```
<div id="page-wrapper">

    <!-- HEADER -->

    <header id="header" class="alt">

        <h1>
            <a href="index.html">
                Jacqueline
            </a>
        </h1>

        <nav id="nav">

            <ul>

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li class="dropdown">

                    <a href="shop.html">
                        Shop
                    </a>

                    <ul class="dropdown-menu">

                        <li>
                            <a href="jewelry.html">
                                Jewelry
                            </a>
                        </li>

                        <li>
                            <a href="wall_art.html">
                                Wall Art
                            </a>
                        </li>

                    </ul>

                </li>

                <li>
                    <a href="featured.html">
                        Featured
                    </a>
                </li>

                <li>
                    <a href="collections.html">
                        Collections
                    </a>
                </li>

                <li>
                    <a href="gallery.html" class="active-nav">
                        Gallery
                    </a>
                </li>

                <li>
                    <a href="about.html">
                        About
                    </a>
                </li>

                <li>

                    <a href="cart.html">

                        <img
                            src="assets/images/cart.png"
                            alt="Cart"
                            class="cart-icon"
                        >

                    </a>

                </li>

            </ul>

        </nav>

    </header>

    <!-- ARTWORK DETAIL PAGE -->

    <section
        class="artwork-page"
        id="artworkPage"
    >

        <a
            href="gallery.html"
            class="back-link"
        >
            &lt; Back to Gallery
        </a>

        <div class="artwork-detail">

            <h2 id="artworkTitle"></h2>

            <div
                class="artwork-collection"
                id="artworkCollection"
            ></div>

            <button
                type="button"
                class="artwork-image-button"
                id="artworkImageButton"
                aria-label="View artwork larger"
            >

                <img
                    id="artworkImage"
                    class="artwork-detail-image"
                    src=""
                    alt=""
                >

            </button>

            <p class="artwork-zoom-note">
                Click the image for a closer look.
            </p>

            <p
                class="artwork-detail-caption"
                id="artworkCaption"
            ></p>

            <button
                type="button"
                class="button small"
                id="readMoreButton"
            >
                Read More
            </button>

        </div>

    </section>

    <!-- READ MORE MODAL -->

    <div
        class="artwork-modal-overlay"
        id="artworkModal"
    >

        <div class="artwork-modal-card">

            <h2 id="modalArtworkTitle"></h2>

            <h3 id="modalArtworkCollection"></h3>

            <p
                class="modal-artwork-caption"
                id="modalArtworkCaption"
            ></p>

            <hr>

            <p
                class="modal-artwork-notes"
                id="modalArtworkNotes"
            ></p>

        </div>

    </div>

    <!-- ARTWORK IMAGE ZOOM MODAL -->

    <div
        class="artwork-image-modal-overlay"
        id="artworkImageModal"
    >

        <img
            id="zoomArtworkImage"
            class="artwork-zoom-image"
            src=""
            alt=""
        >

    </div>

    <!-- FOOTER -->

    <footer id="footer">

        <ul class="icons">

            <li>
                <a href="#" class="fa-brands fa-instagram"></a>
            </li>

            <li>
                <a href="#" class="fa-brands fa-x-twitter"></a>
            </li>

            <li>
                <a href="#" class="fa-brands fa-github"></a>
            </li>

        </ul>

        <ul class="copyright">

            <li>
                &copy; Jacqueline 2025
            </li>

            <li>
                Design adapted from HTML5 UP
            </li>

        </ul>

    </footer>

</div>

<script src="assets/js/main.js"></script>
```

</body>

</html>
